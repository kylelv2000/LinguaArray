# LinguaArray Configuration File
# A simplified configuration template with core options only

# ================================
# Run Mode Configuration
# ================================

# Run mode: full, solver-only, generate-json, solve-with-json
run_mode = full

# Log level: quiet, error, warn, info, debug, verbose
log_level = quiet

# Show execution timing
# show_timing = true

# Save intermediate result files
save_intermediate = true

# Output directory
output_dir = "output"

# ================================
# LLM Configuration
# ================================

# OpenAI API key (required for LLM enhanced features)
llm_api_key = "YOUR_API_KEY_HERE"

# LLM API endpoint (supports custom endpoints like Azure OpenAI)
llm_api_base = "https://api.openai.com/v1"

# LLM model name
llm_model = "gpt-4"

# LLM temperature parameter (0.0-2.0, controls output randomness)
llm_temperature = 1.0

# LLM max tokens
llm_max_tokens = 8192

# LLM request timeout (seconds)
llm_timeout = 300.0

# LLM intermediate validation timeout (seconds)
# Controls solver timeout in LLM enhanced workflow intermediate validation steps
# Recommend setting a shorter time for better overall efficiency
llm_intermediate_timeout = 5

# LLM max retries
# llm_max_retries = 3

# Custom system prompt
# llm_system_prompt = "You are an expert in SMT solving and formal verification."

# Constraint generation prompt (LLM will return 3-5 key constraints to accelerate solving)
# llm_function_prompt = "Analyze the SMT problem and return 3-5 key constraints (assignments, lemmas, or properties)"

# Optimization prompt
# llm_optimization_prompt = "Optimize the following SMT constraints."

# Enable streaming response
# llm_enable_streaming = false

# OpenAI organization ID (optional)
# llm_organization_id = ""

# ================================
# vLLM Local Deployment Configuration
# ================================

# Whether this is a locally deployed vLLM model
# When set to true, JSON forced mode is disabled and special response format parsing is enabled
# llm_is_local_vllm = false

# Whether to force JSON mode
# Some models deployed with vLLM (e.g., DeepSeek-R1) may not support response_format
# llm_force_json_mode = true

# ================================
# Local vLLM DeepSeek Example Configuration
# ================================
# To use a locally deployed DeepSeek model with vLLM, use the following configuration:
# llm_api_base = "http://localhost:8088/v1"
# llm_model = "deepseek-ai/DeepSeek-R1-0528-Qwen3-8B"
# llm_api_key = "EMPTY"  # vLLM usually doesn't need API key, but requires a value
# llm_is_local_vllm = true
# llm_force_json_mode = false
# llm_temperature = 0.6
# llm_max_tokens = 8192


# ================================
# Solver Configuration (Required)
# ================================

# Solver binary file path or name (required)
# Note: Must specify a valid solver path, no default value provided
solver_binary = "solvers/z3"

# Solver timeout (seconds)
solver_timeout = 120

# ================================
# Usage Examples and Notes
# ================================

# 1. Basic usage - Full mode (LLM + Solver)
#    run_mode = full
#    llm_api_key = "your_key"
#    solver_binary = "solvers/z3"

# 2. Solver only mode
#    run_mode = solver-only
#    solver_binary = "solvers/z3"

# 3. Generate JSON file mode
#    run_mode = generate-json
#    llm_api_key = "your_key"
#    solver_binary = "solvers/z3"

# 4. Solve with JSON file
#    run_mode = solve-with-json
#    solver_binary = "solvers/z3"

# ================================
# Command Line Arguments
# ================================

# All configuration items support command line arguments with -- prefix and hyphens
# Examples:
#   --llm-model gpt-3.5-turbo
#   --solver-timeout 60
#   --log-level debug

# Shortcut arguments:
#   --verbose, -v     -> log_level = verbose
#   --quiet, -q       -> log_level = quiet
#   --debug           -> log_level = quiet
#   --solver-only     -> run_mode = solver-only
#   --generate-json   -> run_mode = generate-json
#   --solve-with-json -> run_mode = solve-with-json

# ================================
# Configuration Priority
# ================================

# Configuration loading priority: Command line args > Config file > Default values
# Use --config argument to specify config file path
